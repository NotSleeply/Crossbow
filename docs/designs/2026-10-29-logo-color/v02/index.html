<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Crossbow B1 · B 色正式资产</title>
  </head>
  <body>
    <main class="brand-proof">
      <header>
        <span>Crossbow / B1</span><span>已确认 B 色 · #3F52CF</span>
      </header>
      <h1>同一抹靛蓝，统一每个入口。</h1>
      <div class="brand-panels">
        <section class="brand-light">
          <p>桌面导航 · 浅色</p>
          <div class="brand-lockup">
            <span class="cb-logo-glyph proof-mark"></span
            ><strong>Crossbow</strong>
          </div>
        </section>
        <section class="brand-dark dark">
          <p>桌面导航 · 深色</p>
          <div class="brand-lockup">
            <span class="cb-logo-glyph proof-mark"></span
            ><strong>Crossbow</strong>
          </div>
        </section>
      </div>
      <div class="brand-exports">
        <section>
          <p>应用图标 / Dock</p>
          <img
            class="app-export"
            width="100"
            height="100"
            alt="正式应用图标"
          /><small>PNG · ICNS · ICO</small>
        </section>
        <section>
          <p>官网 / favicon</p>
          <div class="favicon-proof">
            <img class="web-mark" width="44" height="44" alt="官网Logo" /><img
              class="favicon-export"
              width="32"
              height="32"
              alt="正式favicon"
            />
          </div>
          <small>与应用共享母版</small>
        </section>
        <section>
          <p>iOS AppIcon</p>
          <img
            class="ios-export"
            width="100"
            height="100"
            alt="iOS正式图标"
          /><small>不透明 1024px 原始资产</small>
        </section>
      </div>
      <footer>
        直接使用项目生成资产与桌面 Logo 样式 · 保持 B1 造型、图标底色和模板托盘
        · 2026.10.30
      </footer>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
