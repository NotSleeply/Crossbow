<!doctype html><meta charset="utf-8"><title>Crossbow · 窗口矩阵</title>
<style>body{margin:24px;background:#eef0f5;color:#242b37;font:14px system-ui}h1{font-size:22px}main{display:flex;flex-wrap:wrap;align-items:flex-start;gap:24px}.case{margin:0}figcaption{margin-bottom:8px}.viewport{position:relative;overflow:hidden;border:1px solid #cdd2df;border-radius:8px;background:white}iframe{border:0;transform:scale(.5);transform-origin:top left;position:absolute;inset:0}</style>
<h1>概览空间分配 · 生产组件矩阵</h1><p>每个 iframe 使用标注的真实 CSS 视口。可单独打开原尺寸；模拟数据不连接真实代理。</p><main id="cases"></main>
<script>
const cases=[['最小窗口',880,560,'?tun=1'],['用户截图比例',880,630,'?tun=1'],['默认窗口',1120,720,''],['默认窗口 + 更新',1120,720,'?banner=1'],['深色英文 + 更新',880,630,'?banner=1&dark=1&en=1'],['窄高',880,1100,''],['宽矮',1920,600,'?tun=1'],['状态说明',880,560,'?case=stopped'],['大窗口',1440,960,'']];
for(const [name,w,h,query] of cases){const figure=document.createElement('figure');figure.className='case';const caption=document.createElement('figcaption');const link=document.createElement('a');link.href='/'+query;link.target='_blank';link.textContent=`${name} · ${w}×${h}`;caption.append(link);const viewport=document.createElement('div');viewport.className='viewport';viewport.style.width=w*.5+'px';viewport.style.height=h*.5+'px';const frame=document.createElement('iframe');frame.title=link.textContent;frame.src='/'+query;frame.style.width=w+'px';frame.style.height=h+'px';viewport.append(frame);figure.append(caption,viewport);document.getElementById('cases').append(figure)}
</script>
