<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crossbow · 节点工具栏 v01</title><link rel="stylesheet" href="style.css">
<header><strong>Crossbow</strong><nav>概览 <b>节点</b> 监测 配置 设置</nav><button id="theme">切换明暗</button><span>示例订阅 ›</span></header>
<main><aside><h2>节点</h2><p>策略组</p><button class="chosen">节点选择<small>Selector</small></button><button>自动选择<small>URLTest</small></button><button>国际媒体<small>Selector</small></button><button>电报代理<small>Selector</small></button><button>AI 服务<small>Selector</small></button></aside>
<section class="workspace"><div class="heading"><div><h1>节点选择 <span id="total">101 个节点</span></h1><p>当前 <b id="current">自动选择</b><span class="type">Selector</span></p></div><div class="actions"><details id="subscription"><summary>订阅信息</summary><div class="popover"><b>示例订阅</b><p>剩余流量 <strong>975.04 MB</strong></p><p>套餐到期 <strong>长期有效</strong></p><p>更新于 5 分钟前</p></div></details><button id="refresh" aria-label="刷新节点" title="刷新节点">↻</button><button id="test" class="primary">延迟测试</button></div></div>
