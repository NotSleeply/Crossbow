<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crossbow · 主按钮同色 Logo</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f8fb;color:#242b37;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1440px;margin:auto;padding:32px}h1{font-size:32px;line-height:1.4;margin:14px 0 12px}p{color:#596777}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.modes{display:flex;padding:3px;border:1px solid #cdd2df;border-radius:8px;background:#eef0f5;gap:3px}.modes button{font:inherit;border:0;background:transparent;color:#596777;border-radius:6px;padding:8px 14px;cursor:pointer}.modes button[aria-pressed=true]{background:#293345;color:white}button:focus-visible,a:focus-visible{outline:2px solid #455ab5;outline-offset:3px}.stages{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}.stage-head{display:flex;justify-content:space-between;color:#596777;font-size:12px;margin-bottom:8px}.stage-head a{color:#455ab5;text-decoration:none}.viewport{position:relative;aspect-ratio:1120/720;border:1px solid #e4e7ee;border-radius:10px;overflow:hidden;background:#eef0f5}.viewport iframe{position:absolute;inset:0;width:1120px;height:720px;border:0;transform-origin:top left}.dock{display:flex;align-items:center;gap:24px;padding:18px 24px;margin-top:24px;background:white;border:1px solid #e4e7ee;border-radius:10px}.dock img{width:112px}.dock strong{font-size:18px}.board{display:block;width:100%;height:auto;margin-top:32px;border-radius:12px}.foot{margin-top:18px;font-size:12px;color:#596777}code{font:13px ui-monospace,SFMono-Regular,monospace}@media(max-width:1050px){.stages{grid-template-columns:1fr}}@media(max-width:600px){main{padding:18px}h1{font-size:27px}.dock{gap:12px;padding:14px}.dock img{width:88px}}</style>
<main><div class="top"><div><h1>Logo，与主按钮同色。</h1><p>浅色主色 <code>#293345</code> · 深色主按钮 <code>#E7EAF2</code></p></div><div class="modes" aria-label="Logo 主题策略"><button id="fixed" aria-pressed="true">固定同色</button><button id="adaptive" aria-pressed="false">随主题切换</button></div></div><p id="note">固定同色：明暗界面都使用 #293345。深色下标志会明显变暗，请重点比较右侧效果。</p>
<div class="stages"><section><div class="stage-head"><span>浅色 · 正式应用组件 / 模拟数据</span><a id="light-link" target="_blank">原尺寸打开 ↗</a></div><div class="viewport"><iframe id="light" title="浅色应用"></iframe></div></section><section><div class="stage-head"><span>深色 · 正式应用组件 / 模拟数据</span><a id="dark-link" target="_blank">原尺寸打开 ↗</a></div><div class="viewport"><iframe id="dark" title="深色应用"></iframe></div></section></div>
<div class="dock"><img src="assets/dock-icon.svg" alt="主按钮同色 Dock 图标"><div><strong>Dock · #293345</strong><p>保留浅色底板与原有安全区，系统切换明暗时保持同一图标。</p><a href="assets/dock-icon.svg" download>下载 Dock SVG</a></div></div>
<img class="board" src="previews/comparison.png" alt="现用岩蓝与主按钮色在明暗主题和 Dock 中的对照"><p class="foot">这是配色提案，未修改生产品牌资源。下方 Dock 条为设计模拟；独立 AppKit 预览程序可在真实 Dock 中显示测试图标。实际应用页面只修改预览进程中的品牌色变量，不写入你的配置。</p></main>
<script>
const fit=new ResizeObserver(entries=>{for(const entry of entries)entry.target.querySelector('iframe').style.transform=`scale(${entry.contentRect.width/1120})`});document.querySelectorAll('.viewport').forEach(el=>fit.observe(el));
function choose(mode){for(const key of ['fixed','adaptive'])document.getElementById(key).setAttribute('aria-pressed',mode===key);document.getElementById('note').textContent=mode==='fixed'?'固定同色：明暗界面都使用 #293345。深色下标志会明显变暗，请重点比较右侧效果。':'随主题切换：浅色 #293345，深色 #E7EAF2；与各主题主按钮保持同色。Dock 仍使用深色标志与浅色底板。';for(const theme of ['light','dark']){const url=`app.html?mode=${mode}${theme==='dark'?'&dark=1':''}`;document.getElementById(theme).src=url;document.getElementById(theme+'-link').href=url}history.replaceState(null,'','#'+mode)}
document.getElementById('fixed').onclick=()=>choose('fixed');document.getElementById('adaptive').onclick=()=>choose('adaptive');choose(location.hash==='#adaptive'?'adaptive':'fixed');
</script></html>
