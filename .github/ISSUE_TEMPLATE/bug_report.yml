name: Bug Report / Bug 报告
description: Report a problem with Crossbow — one issue per problem / 反馈 Crossbow 的问题——一个 issue 只报一个问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Before submitting:

        1. [Search existing issues](https://github.com/Richard-Zhang1019/Crossbow/issues?q=is%3Aissue+) to avoid duplicates;
        2. One issue per problem;
        3. The version number and diagnostics decide how fast this can be fixed — without them most reports just go back and forth.

        ---

        感谢反馈！提交前请：

        1. [搜索已有 issue](https://github.com/Richard-Zhang1019/Crossbow/issues?q=is%3Aissue+)，避免重复；
        2. 一个 issue 只描述一个问题；
        3. **版本号与诊断信息决定排查速度**——缺它们的问题大多只能来回追问。
  - type: textarea
    id: description
    attributes:
      label: What happened? / 问题描述
      description: |
        What actually happened, and what did you expect?
        实际发生了什么？你期望发生什么？
      placeholder: Be concise — not just "it doesn't work". / 简明扼要地说明现象与期望，不要只写"不能用"。
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Issue type / 问题类型
      options:
        - Kernel startup / runtime error · 内核启动 / 运行异常
        - Proxy not working (system proxy / TUN) · 代理不生效
        - Crash or white screen · 崩溃或白屏
        - Subscription & config · 订阅与配置
        - App update · 应用更新
        - UI display · 界面显示
        - Other · 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Crossbow version / Crossbow 版本
      description: |
        Settings → App version, or the window footer.
        设置 → 当前版本，或应用窗口右下角页脚。
      placeholder: e.g. v0.13.5 / 例如 v0.13.5
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      options:
        - macOS (Apple Silicon)
        - Windows x64
        - Linux x86_64 (experimental / 实验性)
        - Other / 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      description: |
        How do you trigger this from scratch? Every time or intermittent?
        从头到尾怎么操作会出现这个问题？必现还是偶现？
      placeholder: |
        1. Open … / 打开 …
        2. Click … / 点击 …
        3. … happens / 出现 …
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics / logs / 诊断信息与日志
      description: |
        Export from the Diagnostics page, or paste kernel log excerpts. Redact subscription URLs and tokens.
        诊断页导出的结果，或内核日志节选。请务必脱敏订阅地址与 token。
      placeholder: Failed checks, error text, relevant log lines… / 失败项、错误文本、相关日志片段……
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / 截图
      description: Screenshots that help explain the problem — just drag them in. / 有助于说明问题的截图（直接拖进来）。
