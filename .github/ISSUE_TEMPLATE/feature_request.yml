name: 功能建议 / Feature Request
description: 建议新功能或改进——先讲场景与痛点，再讲方案
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！提交前请：
        1. [搜索已有 issue](https://github.com/Richard-Zhang1019/Crossbow/issues?q=is%3Aissue+)，避免重复；
        2. 先说清楚**你在什么场景下遇到了什么问题**——场景决定方案是否合理。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与痛点
      description: 你在什么场景下想做做什么？现在的阻碍是什么？
      placeholder: "例如：在××环境下需要××，但现在只能××。"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望 Crossbow 怎么做？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 现有变通
      description: 你现在是怎么绕过去的？有没有想过其他方案？
  - type: dropdown
    id: platform
    attributes:
      label: 适用平台
      options:
        - 所有平台
        - macOS
        - Windows
        - Linux（实验性）
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索既有 issue，没有重复建议
          required: true
        - label: 我理解这只是建议，是否实现与排期由维护者评估
          required: true
