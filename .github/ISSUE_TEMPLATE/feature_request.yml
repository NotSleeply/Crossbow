name: Feature Request / 功能建议
description: Suggest a feature — scenario first / 建议新功能——先讲场景与痛点
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Before submitting:

        1. [Search existing issues](https://github.com/Richard-Zhang1019/Crossbow/issues?q=is%3Aissue+) to avoid duplicates;
        2. Describe the scenario first — the scenario decides whether a solution makes sense.

        ---

        感谢建议！提交前请：

        1. [搜索已有 issue](https://github.com/Richard-Zhang1019/Crossbow/issues?q=is%3Aissue+)，避免重复；
        2. 先说清楚**你在什么场景下遇到了什么问题**——场景决定方案是否合理。
  - type: textarea
    id: scenario
    attributes:
      label: Scenario & pain point / 使用场景与痛点
      description: |
        What were you trying to do, and what is blocking you?
        你在什么场景下想做什么？现在的阻碍是什么？
      placeholder: "e.g. In ×× environment I need ××, but currently I can only ××. / 例如：在××环境下需要××，但现在只能××。"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired solution / 期望的方案
      description: How would you like Crossbow to handle this? / 你希望 Crossbow 怎么做？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / workarounds / 备选方案与现有变通
      description: How do you work around it today? Other ideas? / 你现在是怎么绕过去的？有没有想过其他方案？
  - type: dropdown
    id: platform
    attributes:
      label: Relevant platform / 适用平台
      options:
        - All platforms / 所有平台
        - macOS
        - Windows
        - Linux (experimental / 实验性)
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting / 提交前确认
      options:
        - label: I have searched existing issues and found no duplicates / 我已搜索既有 issue，没有重复建议
          required: true
        - label: I understand this is a suggestion for the maintainers to evaluate / 我理解这只是建议，是否实现与排期由维护者评估
          required: true
