<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved appearance before the first paint. Storage may be blocked.
      (() => {
        let theme = "system", language;
        try {
          theme = localStorage.getItem("crossbow.site.theme") || "system";
          language = localStorage.getItem("crossbow.site.language");
        } catch {}
        const dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.lang = language === "en" || language === "zh-CN" ? language : navigator.language.toLowerCase().startsWith("zh") ? "zh-CN" : "en";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#1a1c21" : "#ffffff";
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Crossbow — macOS / Windows 与 Linux 实验版开源代理客户端</title>
    <meta
      name="description"
      content="Crossbow 是 macOS / Windows 开源代理客户端：mihomo / sing-box 双内核、订阅管理、系统代理与 TUN、托盘实时速率。提供 Apple Silicon DMG、Windows x64 安装包与社区共建的 Linux x86_64 实验版。"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
