name: Crossbow
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CROSSBOW_APP_GROUP: group.com.richard.crossbow.ios
    CROSSBOW_TUNNEL_ID: com.richard.crossbow.ios.PacketTunnel
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_DEBUG_DYLIB: NO
targets:
  Crossbow:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
        com.apple.NetworkExtensions:
          enabled: 1
    sources: [Crossbow, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.richard.crossbow.ios
        PRODUCT_MODULE_NAME: CrossbowApp
    dependencies:
      - target: PacketTunnel
        embed: true
    entitlements:
      path: .build/generated/Crossbow.entitlements
      properties:
        com.apple.security.application-groups: [group.com.richard.crossbow.ios]
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    info:
      path: .build/generated/Crossbow-Info.plist
      properties:
        CFBundleDisplayName: Crossbow
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CrossbowAppGroup: "$(CROSSBOW_APP_GROUP)"
        CrossbowTunnelID: "$(CROSSBOW_TUNNEL_ID)"
        LSSupportsOpeningDocumentsInPlace: true
  PacketTunnel:
    type: app-extension
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
        com.apple.NetworkExtensions:
          enabled: 1
    sources: [PacketTunnel, Shared]
    dependencies:
      - sdk: UIKit.framework
      - framework: Frameworks/Tunnelcore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(CROSSBOW_TUNNEL_ID)"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        OTHER_LDFLAGS: ["$(inherited)", "-lresolv"]
    entitlements:
      path: .build/generated/PacketTunnel.entitlements
      properties:
        com.apple.security.application-groups: [group.com.richard.crossbow.ios]
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    info:
      path: .build/generated/PacketTunnel-Info.plist
      properties:
        CFBundleDisplayName: Crossbow Tunnel
        CrossbowAppGroup: "$(CROSSBOW_APP_GROUP)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PacketTunnelProvider"
schemes:
  Crossbow:
    build:
      targets:
        Crossbow: all
    run:
      config: Debug
